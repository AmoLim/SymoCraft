total_frames: 3
focus:
  transitions: 0
  unfocused_frames: 0
  sample_unfocused_frames: 0
  unfocused_seconds_estimate: 0
  sample_unfocused_seconds_estimate: 0
  duration_method: sum frame intervals classified by focus at event polling; approximate
