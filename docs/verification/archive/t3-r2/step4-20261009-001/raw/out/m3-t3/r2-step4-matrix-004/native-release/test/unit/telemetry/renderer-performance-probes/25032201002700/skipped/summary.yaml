metadata:
  schema_version: 2
  protocol_version: 2
  workload_version: 2
  focus_policy: strict
  benchmark: ""
  warmup_seconds: 60
  sample_seconds: 180
  requested_framebuffer_width: 1920
  requested_framebuffer_height: 1080
  requested_vsync: false
  percentile_method: nearest-rank, ceil(p*N)-1; no outlier removal
  frame_time_scope: consecutive Renderer::Render return intervals; not physical display latency
  gpu_time_scope: mesh/selection timestamps; excludes clear, upload, resolve, screenshot and Present
  memory_scope: process working set/private bytes; optional device-wide estimates are not process VRAM
  cpu_temperature: missing; no portable sensor interface enabled
  gpu_temperature: not collected by game; an external collector may supply it separately
  build_configuration: Release
  msvc_version: 193833145
  renderer:
    backend: d3d12
    device_name: actual-device
    device_identity: actual-luid
    driver_version: actual-driver
    api_version: FL12_0 SM6_0
    framebuffer_format: RGBA8_UNORM
    framebuffer_width: 803
    framebuffer_height: 557
    actual_samples: 4
    actual_present_mode: immediate
    validation_enabled: true
    capabilities:
      texture_arrays: true
      selection_boxes: true
      screenshots: true
      gpu_timestamps: true
  renderer_backend: d3d12
  renderer_telemetry_version: 1
  cpu_prepare_scope: Renderer validation/preparation and backend frame-context reuse wait; excludes scene cache Create/Update
  cpu_submit_scope: backend command preparation/submission; not derived by subtracting upload time
  upload_cpu_scope: application scene-cache Synchronize CPU interval, including scan, owned-copy conversion, Create/Update and draw-list assembly; excludes Render CPU preparation/submission
  upload_bytes_scope: successful persistent-cache resource uploads counted once plus Render-local uploads; startup separately attributed
  gpu_missing_sample_scope: missing durations remain absent; unreturned IDs are not-returned at export
startup_ms: ~
completed: true
valid_run: false
invalid_reasons:
